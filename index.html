<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Proposta Comercial (Orçamento)</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* Estilos Base */
        body { font-family: 'Inter', Arial, sans-serif; margin: 20px; background-color: #f8f8f8; color: #333; }
        .container { max-width: 1100px; margin: auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1); }
        h1 { color: #1e88e5; text-align: center; border-bottom: 3px solid #1e88e5; padding-bottom: 10px; }
        h2 { color: #333; border-left: 5px solid #1e88e5; padding-left: 10px; margin-top: 25px; }
        label { display: block; margin-top: 10px; font-weight: 600; }
        input, textarea { width: 100%; padding: 10px; margin-top: 5px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; }
        .two-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .form-section { margin-bottom: 30px; padding: 20px; border: 1px solid #e0e0e0; border-radius: 10px; }

        /* Tabela de Itens */
        #itemsTable { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 0.8em; }
        #itemsTable th, #itemsTable td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        #itemsTable th { background-color: #e3f2fd; color: #1e88e5; }
        .text-right { text-align: right; }
        
        /* Novos inputs pequenos para links */
        .link-input { font-size: 0.7em; padding: 4px; margin-top: 4px; border: 1px dashed #1e88e5; }

        /* Botões */
        .btn-base { border: none; padding: 10px 20px; cursor: pointer; border-radius: 6px; font-weight: bold; transition: 0.3s; }
        .btn-add { background-color: #43a047; color: white; }
        .btn-action { background-color: #1e88e5; color: white; flex-grow: 1; padding: 15px; }
        .btn-group { display: flex; gap: 10px; margin-top: 20px; }

        /* Resumo */
        .finance-summary { margin-top: 20px; padding: 15px; background-color: #e8f5e9; border-radius: 8px; }
        .summary-item { display: flex; justify-content: space-between; margin-bottom: 5px; }

        /* Estilos de Impressão (PDF) */
        @media print {
            .form-section, .btn-group, .btn-add, .btn-remove, .link-input, .image-inputs-wrapper, .finance-summary { display: none !important; }
            body { background: white; }
            .container { box-shadow: none; width: 100%; }
            #itemsTable { font-size: 10pt; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Gerador de Proposta Comercial</h1>
    <div id="message-box" style="display: none; padding: 10px; margin-bottom: 10px; border-radius: 5px;"></div>

    <input type="hidden" id="empresa_razao" value="Carlos Kipper Ltda">
    <input type="hidden" id="empresa_cnpj" value="13.408.443/0001-68">

    <div class="form-section">
        <h2>Dados da Proposta</h2>
        <div class="two-cols">
            <div><label>Nº Orçamento:</label><input type="text" id="orcamento_numero"></div>
            <div><label>Data:</label><input type="date" id="orcamento_data"></div>
        </div>
        <label>Cliente:</label><input type="text" id="cliente_nome">
    </div>

    <div class="form-section">
        <h2>Cálculo Simples Nacional</h2>
        <label>RBT12 (R$):</label>
        <input type="text" id="rbt12" value="960.000,00" oninput="updateSimplesNacional()">
        <p>Alíquota Efetiva: <strong id="aliquota_label">0,00%</strong></p>
        <input type="hidden" id="aliquota_efetiva_decimal" value="0">
    </div>

    <div class="form-section">
        <h2>Itens</h2>
        <table id="itemsTable">
            <thead>
                <tr>
                    <th>Img</th>
                    <th>Produto / Links</th>
                    <th>Qtd</th>
                    <th>Custo Unit</th>
                    <th>Margem (%)</th>
                    <th>Venda Unit</th>
                    <th>Total</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="itemsBody"></tbody>
        </table>
        <button class="btn-add btn-base" onclick="addItemRow()">+ Adicionar Item</button>
    </div>

    <div class="finance-summary">
        <div class="summary-item"><span>Custo Total:</span> <strong id="resumo-custo">R$ 0,00</strong></div>
        <div class="summary-item"><span>Lucro Líquido Final:</span> <strong id="resumo-lucro-liquido">R$ 0,00</strong></div>
    </div>

    <div class="btn-group">
        <button class="btn-action btn-base" onclick="window.print()">Imprimir PDF</button>
        <button class="btn-action btn-base" style="background:#ff9800" onclick="exportProposalAsJson()">Exportar JSON</button>
        <button class="btn-action btn-base" style="background:#8bc34a" onclick="document.getElementById('json-upload').click()">Importar JSON</button>
        <input type="file" id="json-upload" style="display:none" onchange="handleJsonUpload(event)">
    </div>
</div>

<script>
    let itemCounter = 0;
    const TAX_BRACKETS = [
        { max: 180000, aliq: 0.04, ded: 0 },
        { max: 360000, aliq: 0.073, ded: 5940 },
        { max: 720000, aliq: 0.095, ded: 13860 },
        { max: 1800000, aliq: 0.107, ded: 22500 },
        { max: 3600000, aliq: 0.143, ded: 87300 },
        { max: 4800000, aliq: 0.19, ded: 378000 }
    ];

    function cleanCurrency(val) {
        return parseFloat(String(val).replace(/\./g, '').replace(',', '.')) || 0;
    }

    function formatCurrency(val) {
        return val.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    function updateSimplesNacional() {
        const rbt12 = cleanCurrency(document.getElementById('rbt12').value);
        let bracket = TAX_BRACKETS.find(b => rbt12 <= b.max) || TAX_BRACKETS[5];
        let ae = ((rbt12 * bracket.aliq) - bracket.ded) / rbt12;
        ae = Math.max(0, ae);
        document.getElementById('aliquota_label').innerText = (ae * 100).toFixed(2) + '%';
        document.getElementById('aliquota_efetiva_decimal').value = ae;
        updateTotals();
    }

    function addItemRow(data = null) {
        const tbody = document.getElementById('itemsBody');
        const rowId = `row-${itemCounter++}`;
        const tr = document.createElement('tr');
        tr.id = rowId;

        tr.innerHTML = `
            <td>
                <img src="${data?.imgUrl || ''}" style="width:50px; display:${data?.imgUrl ? 'block' : 'none'}">
                <div class="image-inputs-wrapper">
                    <input type="text" class="link-input" placeholder="Link da Imagem" value="${data?.imgUrl || ''}" onchange="updateRowImg(this)">
                </div>
            </td>
            <td>
                <textarea class="item-name" placeholder="Descrição do Produto">${data?.name || ''}</textarea>
                <input type="text" class="link-input product-link" placeholder="Link do Produto (Só p/ JSON)" value="${data?.productUrl || ''}">
            </td>
            <td><input type="number" class="item-qtd" value="${data?.qtd || 1}" oninput="updateTotals()"></td>
            <td><input type="text" class="item-cost" value="${data?.cost || '0,00'}" oninput="updateTotals()"></td>
            <td><input type="text" class="item-margin" value="${data?.margin || '30,00'}" oninput="updateTotals()"></td>
            <td><input type="text" class="item-price-unit readonly" readonly></td>
            <td class="item-total-cell">R$ 0,00</td>
            <td><button class="btn-remove btn-base" style="background:#d32f2f; color:white" onclick="this.closest('tr').remove(); updateTotals();">X</button></td>
        `;
        tbody.appendChild(tr);
        updateTotals();
    }

    function updateRowImg(input) {
        const img = input.closest('td').querySelector('img');
        img.src = input.value;
        img.style.display = input.value ? 'block' : 'none';
    }

    function updateTotals() {
        const ae = parseFloat(document.getElementById('aliquota_efetiva_decimal').value);
        let totalCusto = 0, totalVenda = 0;

        document.querySelectorAll('#itemsBody tr').forEach(row => {
            const cost = cleanCurrency(row.querySelector('.item-cost').value);
            const margin = cleanCurrency(row.querySelector('.item-margin').value) / 100;
            const qtd = parseFloat(row.querySelector('.item-qtd').value) || 0;
            
            // Fórmula: Preço = (Custo * (1 + Margem)) / (1 - Imposto)
            const unitPrice = (cost * (1 + margin)) / (1 - ae);
            const totalItem = unitPrice * qtd;

            row.querySelector('.item-price-unit').value = unitPrice.toFixed(2).replace('.', ',');
            row.querySelector('.item-total-cell').innerText = formatCurrency(totalItem);

            totalCusto += (cost * qtd);
            totalVenda += totalItem;
        });

        document.getElementById('resumo-custo').innerText = formatCurrency(totalCusto);
        const impostoTotal = totalVenda * ae;
        document.getElementById('resumo-lucro-liquido').innerText = formatCurrency(totalVenda - totalCusto - impostoTotal);
    }

    function exportProposalAsJson() {
        const items = [];
        document.querySelectorAll('#itemsBody tr').forEach(row => {
            items.push({
                imgUrl: row.querySelector('.link-input').value,
                productUrl: row.querySelector('.product-link').value, // SALVANDO O LINK DO PRODUTO
                name: row.querySelector('.item-name').value,
                qtd: row.querySelector('.item-qtd').value,
                cost: row.querySelector('.item-cost').value,
                margin: row.querySelector('.item-margin').value
            });
        });

        const data = {
            header: {
                numero: document.getElementById('orcamento_numero').value,
                data: document.getElementById('orcamento_data').value,
                cliente: document.getElementById('cliente_nome').value,
                rbt12: document.getElementById('rbt12').value
            },
            items: items
        };

        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `orcamento_${data.header.numero || 'venda'}.json`;
        a.click();
    }

    function handleJsonUpload(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            const data = JSON.parse(e.target.result);
            document.getElementById('orcamento_numero').value = data.header.numero;
            document.getElementById('orcamento_data').value = data.header.data;
            document.getElementById('cliente_nome').value = data.header.cliente;
            document.getElementById('rbt12').value = data.header.rbt12;
            
            document.getElementById('itemsBody').innerHTML = '';
            data.items.forEach(item => addItemRow(item));
            updateSimplesNacional();
        };
        reader.readAsText(file);
    }

    // Inicializa com uma linha vazia
    window.onload = updateSimplesNacional;
</script>

</body>
</html>
