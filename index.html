<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Proposta Comercial (Orçamento)</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* Estilos Base */
        body { font-family: 'Inter', Arial, sans-serif; margin: 20px; background-color: #f8f8f8; color: #333; }
        .container { max-width: 1100px; margin: auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1); }
        h1 { color: #1e88e5; text-align: center; font-size: 2em; margin-bottom: 25px; border-bottom: 3px solid #1e88e5; padding-bottom: 10px; }
        h2 { color: #333; padding-bottom: 5px; margin-top: 25px; font-size: 1.4em; border-left: 5px solid #1e88e5; padding-left: 10px; }
        label { display: block; margin-top: 10px; font-weight: 600; color: #444; }
        input[type="text"], input[type="date"], input[type="number"], input[type="email"], textarea { width: 100%; padding: 10px; margin-top: 5px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; }
        .two-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .form-section { margin-bottom: 30px; padding: 20px; border: 1px solid #e0e0e0; border-radius: 10px; background-color: #fff; }
        
        /* Tabela de Itens */
        #itemsTable { width: 100%; border-collapse: separate; border-spacing: 0; margin-top: 20px; border-radius: 8px; overflow: hidden; }
        #itemsTable th, #itemsTable td { border: 1px solid #ddd; padding: 10px 5px; text-align: left; vertical-align: middle; font-size: 0.7em; }
        #itemsTable th { background-color: #e3f2fd; color: #1e88e5; font-weight: 700; border-bottom: 2px solid #1e88e5; }
        .text-right { text-align: right; }
        .read-only-field { background-color: #eceff1; color: #666; }

        /* Botões */
        .btn-base { border: none; padding: 8px 16px; cursor: pointer; border-radius: 6px; font-weight: bold; }
        .btn-add { background-color: #43a047; color: white; margin-top: 15px; }
        .btn-remove { background-color: #d32f2f; color: white; }
        .btn-group { display: flex; gap: 15px; margin-top: 30px; }
        .btn-action { background-color: #1e88e5; color: white; padding: 15px 25px; border: none; border-radius: 8px; cursor: pointer; font-size: 1.1em; flex-grow: 1; font-weight: bold; }

        /* Resumo Financeiro */
        .finance-summary { margin-top: 30px; padding: 15px; border: 2px solid #43a047; border-radius: 8px; background-color: #e8f5e9; }
        .summary-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px 20px; }
        .summary-item { display: flex; justify-content: space-between; font-size: 1.1em; padding: 5px 0; border-bottom: 1px dashed #c8e6c9; }
        .final-profit { font-size: 1.5em; font-weight: 700; color: #1e88e5; margin-top: 10px; padding-top: 10px; border-top: 2px solid #1e88e5; }

        @media print {
            .form-section, .btn-group, h1, #message-box, .finance-summary { display: none !important; }
            .preview-area { display: block !important; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Gerador de Proposta Comercial</h1>
    <div id="message-box" style="display: none; padding: 15px; margin-bottom: 20px; border-radius: 6px; text-align: center;"></div>

    <div class="form-section">
        <h2>Cálculo Simples Nacional</h2>
        <label for="rbt12">Receita Bruta 12 Meses (RBT12):</label>
        <input type="text" id="rbt12" value="960.000,00" oninput="updateSimplesNacional(true)">
        <div class="two-cols">
            <div><label>Faixa:</label><input type="text" id="faixa_identificada" class="read-only-field" readonly></div>
            <div><label>Alíquota Efetiva (AE):</label><input type="text" id="aliquota_efetiva" class="read-only-field" readonly></div>
        </div>
    </div>

    <div class="form-section">
        <h2>Itens da Proposta</h2>
        <table id="itemsTable">
            <thead>
                <tr>
                    <th>Produto</th>
                    <th class="text-right">Qtd.</th>
                    <th class="text-right">Custo Unit.</th>
                    <th class="text-right">Margem (%)</th>
                    <th class="text-right">Venda Unit.</th>
                    <th class="text-right">Desc. (%)</th>
                    <th class="text-right">Custo Total</th>
                    <th class="text-right">L. Bruto</th>
                    <th class="text-right">L. Líquido</th>
                    <th class="text-right">Total Item</th>
                    <th>Ação</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
        <button class="btn-add btn-base" onclick="addItemRow()">+ Adicionar Item</button>
    </div>

    <div class="finance-summary">
        <div class="summary-grid">
            <div class="summary-item"><strong>Custo Total:</strong> <span id="resumo-custo">R$ 0,00</span></div>
            <div class="summary-item"><strong>Receita Total:</strong> <span id="resumo-receita">R$ 0,00</span></div>
            <div class="summary-item"><strong>Imposto Total:</strong> <span id="resumo-imposto" style="color:red">R$ 0,00</span></div>
            <div class="summary-item"><strong>Lucro Bruto:</strong> <span id="resumo-lucro-bruto">R$ 0,00</span></div>
        </div>
        <div class="final-profit summary-item"><strong>LUCRO LÍQUIDO FINAL:</strong> <span id="resumo-lucro-liquido">R$ 0,00</span></div>
    </div>

    <div class="btn-group">
        <button class="btn-action" onclick="window.print()">Imprimir PDF</button>
    </div>
</div>

<script>
    const TAX_BRACKETS = [
        { max: 180000, aliq: 0.04, ded: 0 },
        { max: 360000, aliq: 0.073, ded: 5940 },
        { max: 720000, aliq: 0.095, ded: 13860 },
        { max: 1800000, aliq: 0.107, ded: 22500 },
        { max: 3600000, aliq: 0.143, ded: 87300 },
        { max: 4800000, aliq: 0.19, ded: 378000 }
    ];

    let AE = 0;

    function cleanCurrency(val) {
        if (!val) return 0;
        return parseFloat(val.toString().replace(/\./g, '').replace(',', '.')) || 0;
    }

    function formatCurrency(val) {
        return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(val);
    }

    function updateSimplesNacional() {
        const rbt12 = cleanCurrency(document.getElementById('rbt12').value);
        let bracket = TAX_BRACKETS.find(b => rbt12 <= b.max) || TAX_BRACKETS[5];
        
        AE = rbt12 > 0 ? ((rbt12 * bracket.aliq) - bracket.ded) / rbt12 : 0;
        document.getElementById('aliquota_efetiva').value = (AE * 100).toFixed(2) + '%';
        document.getElementById('faixa_identificada').value = bracket.max;
        calculateTotal();
    }

    function calculateItemPrice(input) {
        const row = input.closest('tr');
        const custo = cleanCurrency(row.cells[2].querySelector('input').value);
        const margem = cleanCurrency(row.cells[3].querySelector('input').value) / 100;
        
        // VU = (Custo * (1 + Margem)) / (1 - AE)
        const vendaUnit = (custo * (1 + margem)) / (1 - AE);
        row.cells[4].querySelector('input').value = vendaUnit.toFixed(2).replace('.', ',');
        calculateTotal();
    }

    function calculateTotal() {
        let tReceita = 0, tCusto = 0, tImposto = 0;
        const rows = document.querySelector('#itemsTable tbody').rows;

        for (let row of rows) {
            const qtd = parseFloat(row.cells[1].querySelector('input').value) || 0;
            const cUnit = cleanCurrency(row.cells[2].querySelector('input').value);
            const vUnit = cleanCurrency(row.cells[4].querySelector('input').value);
            const desc = cleanCurrency(row.cells[5].querySelector('input').value) / 100;

            const vLiquida = (vUnit * qtd) * (1 - desc);
            const cTotal = cUnit * qtd;
            const imposto = vLiquida * AE;
            const lBruto = vLiquida - cTotal;
            const lLíquido = lBruto - imposto;

            row.cells[6].querySelector('input').value = cTotal.toFixed(2).replace('.', ',');
            row.cells[7].querySelector('input').value = lBruto.toFixed(2).replace('.', ',');
            row.cells[8].querySelector('input').value = lLíquido.toFixed(2).replace('.', ',');
            row.cells[9].innerText = formatCurrency(vLiquida);

            tReceita += vLiquida;
            tCusto += cTotal;
            tImposto += imposto;
        }

        document.getElementById('resumo-receita').innerText = formatCurrency(tReceita);
        document.getElementById('resumo-custo').innerText = formatCurrency(tCusto);
        document.getElementById('resumo-imposto').innerText = formatCurrency(tImposto);
        document.getElementById('resumo-lucro-bruto').innerText = formatCurrency(tReceita - tCusto);
        document.getElementById('resumo-lucro-liquido').innerText = formatCurrency(tReceita - tCusto - tImposto);
    }

    function addItemRow() {
        const tbody = document.querySelector('#itemsTable tbody');
        const row = tbody.insertRow();
        row.innerHTML = `
            <td><input type="text" placeholder="Produto"></td>
            <td><input type="number" value="1" oninput="calculateTotal()"></td>
            <td><input type="text" value="0,00" oninput="calculateItemPrice(this)"></td>
            <td><input type="text" value="30,00" oninput="calculateItemPrice(this)"></td>
            <td><input type="text" value="0,00" oninput="calculateTotal()"></td>
            <td><input type="text" value="0,00" oninput="calculateTotal()"></td>
            <td><input type="text" class="read-only-field" readonly></td>
            <td><input type="text" class="read-only-field" readonly></td>
            <td><input type="text" class="read-only-field" readonly></td>
            <td class="text-right">R$ 0,00</td>
            <td><button class="btn-remove btn-base" onclick="this.closest('tr').remove(); calculateTotal()">X</button></td>
        `;
    }

    // Inicialização
    updateSimplesNacional();
    addItemRow();
</script>
</body>
</html>
